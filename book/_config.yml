title: Global EO Satellite Guide
author: JupyterLite EO Satellite Guide contributors
copyright: "2026"
logo: ../assets/logo.svg
only_build_toc_files: true
execute:
  execute_notebooks: "off"
repository:
  url: https://github.com/jltobias/JupyterLite-EO-Satellite-Guide
  branch: main
  path_to_book: book
html:
  use_repository_button: true
  use_issues_button: true
  home_page_in_navbar: true
sphinx:
  config:
    # Execution is provided by JupyterLite; do not inject the unused Thebe runtime.
    extensions:
      - sphinx_togglebutton
      - sphinx_copybutton
      - myst_nb
      - jupyter_book
      - sphinx_comments
      - sphinx_external_toc
      - sphinx.ext.intersphinx
      - sphinx_design
      - sphinx_book_theme
    html_static_path: ["_static"]
    html_css_files: ["custom.css"]
    html_theme_options:
      navigation_with_keys: true
    suppress_warnings: ["myst.header"]
